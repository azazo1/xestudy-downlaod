name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时不创建 release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  # 发布文件总数: 6 个平台归档 + 1 个 SHA256SUMS.
  # 调整 scripts/dist.py 的 DEFAULT_TARGETS 后必须同步修改这里.
  EXPECTED_ASSET_COUNT: "7"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      # 发布脚本是跨平台的 Python, 经 uv 调用; 托管 runner 镜像里没有预装 uv.
      # 脚本只用标准库, 没有依赖要缓存, 所以关掉 enable-cache.
      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # Go 模块不在文件里维护版本号, tag 是唯一版本来源, 因此这里只校验
      # tag 格式与 release notes 文件是否存在.
      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_NAME" != v* ]]; then
            echo "发布 tag 必须以 v 开头: $TAG_NAME" >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          manual_notes="docs/changelog/$version.md"
          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 非 release 运行没有校验过的 version, 用 build-version.py 现场算一个带
      # 短 hash 的兜底版本号. 仓库还没有任何 tag 时 Go 没有包版本可读, 按语言
      # 模块的约定传 0.0.0 占位, 于是首个 tag 之前的 branch 与 PR 也不会失败.
      - name: 解析构建版本
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "build_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_version="0.0.0"
          echo "build_version=$(PROJECT_PACKAGE_VERSION="$package_version" uv run --no-project python scripts/build-version.py)" >> "$GITHUB_OUTPUT"

  # 测试不能交叉运行, 因此按操作系统各跑一遍, 保留平台分支的真实覆盖.
  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 只报告不修改: CI 里改写工作区会让后续步骤看到与提交不符的内容.
      - name: 检查格式
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "以下文件未格式化:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: 静态检查
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...

      - name: 运行测试
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1

  # 依赖链里没有 cgo, 所以在一个 runner 上交叉编译出全部目标, 不必按平台拆矩阵.
  # 交叉产物跑不起来, dist.py 会改用文件格式, 架构与版本串校验, 只有宿主平台
  # 那一份真跑 --version 冒烟, 确认 -X 注入没有静默失效.
  build:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 生成全部平台发布产物
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
        run: uv run --no-project python scripts/dist.py --all

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: xestudy-downlaod-${{ needs.version.outputs.build_version }}
          path: |
            dist/xestudy-downlaod-*.tar.gz
            dist/xestudy-downlaod-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.version.outputs.is_release == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      # fetch-depth: 0 不能替代这一步: 手动发布时本地可能根本没有该 tag 对象.
      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin \
            "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(xestudy-downlaod-*.tar.gz xestudy-downlaod-*.zip)

          if (( ${#archives[@]} != EXPECTED_ASSET_COUNT - 1 )); then
            echo "预期 $(( EXPECTED_ASSET_COUNT - 1 )) 个归档, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/xestudy-downlaod-*.tar.gz
            release-artifacts/xestudy-downlaod-*.zip
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != EXPECTED_ASSET_COUNT )); then
            echo "预期 $EXPECTED_ASSET_COUNT 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "xestudy-downlaod v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "xestudy-downlaod v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
